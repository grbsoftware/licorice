            const hex = Math.round(x).toString(16);
            return hex.length === 1 ? '0' + hex : hex;
        }).join('').toUpperCase();
    }

    // --- OKLab -------------------------------------------------------
    // A bridge is only a bridge if it LOOKS halfway between its anchors,
    // and HSL cannot promise that. HSL's "L" is not perceived lightness:
    // averaging green (#00FF00) and blue (#0000FF) in HSL gives cyan
    // (#00FFFF), which is LIGHTER than both colors it sits between. It
    // does not bridge, it spikes. Measured in perceptual lightness the
    // anchors are 0.866 and 0.452, so the midpoint should read 0.659 --
    // HSL puts it at 0.905, off by 0.246.

    // The same pair midpoints to #00AABF at 0.675, which is where the eye
    // expects it. Same idea for the anchors themselves: evenly spaced HSL
    // hues range over 0.41 in perceived lightness (red 0.628, green 0.866,
    // blue 0.452), which is why a "smooth" ramp never looked smooth.
    //
    // hslToHex stays, for the initial evenly-spaced anchors. HSL is a fine
    // thing to SPECIFY a starting color in. It is just not a thing to
    // average in, and nothing averages in it any more.

    function srgbToLinear(c) {

    }

    function linearToSrgb(c) {
        const v = c <= 0.0031308 ? 12.92 * c : 1.055 * Math.pow(c, 1 / 2.4) - 0.055;

            -1.2684380046 * l + 2.6097574011 * m - 0.3413193965 * s,
            -0.0041960863 * l - 0.7034186147 * m + 1.7076147010 * s

    // The tolerance is not slop, it is the accuracy of the transform. The
    // OKLab matrices are fitted approximations, so a colour that sits
    // exactly ON the sRGB hull round-trips to a channel a few ten-thousandths
    // the wrong side of zero.
    //
    // At 1e-4 that broke an assumption every bisection here depends on --
    // that the ray out from neutral is in gamut up to one boundary and out
    // after it. Measured along pure blue's ray (L 0.452, H 264.05): in gamut
    // at 85% of its chroma, OUT at 90%, 95% and 99% where linear red reads
    // -0.00063, and in again at 100% where it is exactly 0. A hole in the
    // middle, and a bisection walks straight into it -- maxChroma returned
    // 0.2674 for a colour whose chroma is 0.3132, a 15% underestimate, and
    // oklabToHex used the same pattern to desaturate bridges further than
    // the gamut actually required.
    //
    // 1e-3 clears the transform's own error. In linear light that is well
    // under a quarter of an 8-bit step, and the clamp at the end of
    // oklabToHex catches whatever rounds past the edge.
    const GAMUT_EPS = 1e-3;

    function inGamut(lab) {
        return oklabToLinear(lab).every(c => c >= -GAMUT_EPS && c <= 1 + GAMUT_EPS);
    }

    // OKLab is bigger than sRGB, so a midpoint can land somewhere the screen
    // cannot show. SOMETHING has to give, and the choice of what decides
    // whether the bridge still reads as a bridge.
    //
    // Clamping each channel at the end -- the obvious way, and what this did
    // -- gives away lightness and hue, the two properties the whole OKLab
    // change was made to protect. Measured over every bridge the presets
    // produce, 23 land outside sRGB and clamping moved them up to 3.6 deg in
    // hue and 0.014 in L. The green -> blue midpoint from the notes above
    // came out at L 0.676 against a target of 0.659; that residual was
    // blamed on "gamut clipping" and this is the clipping it meant.
    //
    // Reducing CHROMA instead gives away saturation, which is the one thing
    // a bridge does not promise. Same 23 colors: worst hue shift 0.9 deg,
    // worst L error 0.0009 -- fifteen times closer. Green -> blue now lands
    // at 0.659 exactly, so the residual is gone rather than explained.

                const mid = (lo + hi) / 2;
                if (inGamut({ L: lab.L, a: lab.a * mid, b: lab.b * mid })) lo = mid;
                else hi = mid;

        // and rounding leaves channels a hair over.
        return rgbToHex(...oklabToLinear(out).map(c => linearToSrgb(Math.max(0, Math.min(1, c)))));

    // --- Bridge policy ----------------------------------------------
    // Both midpoints below are in OKLab and both are perceptually honest.
    // They differ in what they treat as the thing being halved.
    //
    // BLEND averages a and b as coordinates: the true midpoint of the two
    // colors as POINTS. a and b are signed, so as the anchors' hues diverge
    // the two vectors point apart and partly cancel -- gold and navy are
    // both strongly colored and their blend is #7E7D70, a drab olive grey.
    // Nothing is out of gamut there; the saturation was destroyed by the
    // arithmetic. Across the shipped presets, 12 bridges lose more than half
    // their anchors' chroma this way.
    //
    // WHEEL averages lightness and chroma as scalars and walks hue around
    // the shorter arc: the midpoint of the two HUES. Chroma at the bridge is
    // the mean of the two chromas by construction, so it cannot collapse and
    // cannot exceed the colors it sits between. Gold -> navy becomes #009083.
    //
    // Neither is a better version of the other, which is the test a setting
    // has to pass to deserve existing. Blend answers "what color is halfway
    // between these two", wheel answers "what color is halfway around from
    // one to the other". Blend stays the default because it is what every
    // saved palette was built with.
    //
    // NOT OFFERED: pushing chroma out to the gamut hull. It was measured and
    // it is a trap -- the headroom is largest exactly where hue means least.
    // Two pale neutrals whose midpoint chroma is 0.002 have 89x of it, and
    // spending it turns a soft grey into #C3FF3B. At C near zero the hue is
    // arbitrary, so amplifying it invents a color rather than finding one.

    function midpointColor(hex1, hex2, mode = 'blend') {
        const c1 = hexToOklab(hex1);
        const c2 = hexToOklab(hex2);
        const L = (c1.L + c2.L) / 2;

        if (mode === 'blend') {
            return oklabToHex({ L, a: (c1.a + c2.a) / 2, b: (c1.b + c2.b) / 2 });
        }

        const k1 = Math.hypot(c1.a, c1.b), k2 = Math.hypot(c2.a, c2.b);
        let h1 = Math.atan2(c1.b, c1.a), h2 = Math.atan2(c2.b, c2.a);
        // A grey has no hue -- CSS Color 4 calls it powerless. atan2(0,0) is
        // 0, which is red, so averaging against it would drag every bridge
        // out of a neutral anchor toward pink. Borrow the other end's hue.
        if (k1 < 1e-6) h1 = h2;
        if (k2 < 1e-6) h2 = h1;
        const d = ((h2 - h1 + Math.PI) % (2 * Math.PI) + 2 * Math.PI) % (2 * Math.PI) - Math.PI;
        const h = h1 + d / 2, c = (k1 + k2) / 2;

    }

    // --- Ink on a bar -------------------------------------------------
    // This used to weight the GAMMA-ENCODED channels 0.299/0.587/0.114 and
    // switch at 0.5. Two things wrong with that, and they compound: the NTSC
    // weights are for analogue luma, not for contrast, and the channels have
    // to be linearised before any weighting means anything.
    //
    // The switch point is not a matter of taste either. White beats black
    // exactly while 1.05/(L+0.05) > (L+0.05)/0.05, so the crossover is
    // sqrt(0.0525) - 0.05 = 0.1791 -- nowhere near the midpoint, because
    // contrast is a ratio and black has the shorter run to the floor.
    //
    // Measured over the 114 colors in the preset library, the old test put
    // the wrong ink on 14 of them. The worst was #FF00FF, which got white at
    // 3.14:1 where black scores 6.70:1. Worst case anywhere goes 3.14 -> 4.72,
    // so every hex code on screen now clears AA at normal size.
    const INK_CROSSOVER = Math.sqrt(0.0525) - 0.05;

    function relativeLuminance(hex) {
        const rgb = hexToRgb(hex);
        return 0.2126 * srgbToLinear(rgb.r)
             + 0.7152 * srgbToLinear(rgb.g)
             + 0.0722 * srgbToLinear(rgb.b);
    }

    function inkOn(hex) {
        return relativeLuminance(hex) > INK_CROSSOVER ? '#000' : '#fff';
    }


    const DEG = 180 / Math.PI;

    function hexToOklch(hex) {
        const { L, a, b } = hexToOklab(hex);
        const C = Math.hypot(a, b);
        // A neutral has no hue -- CSS Color 4 calls it powerless. Reported
        // as null rather than as atan2(0, 0), which is red and would put a
        // grey into the harmony maths as though it pointed somewhere.
        const H = C < 1e-6 ? null : ((Math.atan2(b, a) * DEG) % 360 + 360) % 360;
        return { L, C, H };
    }

    function oklchToHex({ L, C, H }) {
        const h = (H === null ? 0 : H) / DEG;
        return oklabToHex({ L, a: C * Math.cos(h), b: C * Math.sin(h) });
    }

    // The most chroma sRGB can actually show at this lightness and hue.
    // The hull is nothing like a circle -- yellow reaches far further out
    // than blue -- so "hold chroma constant across these hues" is only a
    // request that can be granted up to the SMALLEST hull among them.
    function maxChroma(L, H) {
        if (H === null) return 0;
        const h = H / DEG, cos = Math.cos(h), sin = Math.sin(h);
        let lo = 0, hi = 0.4;
        for (let i = 0; i < 24; i++) {
            const mid = (lo + hi) / 2;
            if (inGamut({ L, a: mid * cos, b: mid * sin })) lo = mid; else hi = mid;
        }
        return lo;
    }

    function contrast(hex1, hex2) {
        const a = relativeLuminance(hex1), b = relativeLuminance(hex2);
        return (Math.max(a, b) + 0.05) / (Math.min(a, b) + 0.05);
    }

    // Perceptual distance, so "widest gap" means the gap that LOOKS widest.
    // Hue distance would call red->green and green->blue equal at 120
    // degrees each when the eye does not read them that way at all.
    function oklabDistance(hex1, hex2) {
        const c1 = hexToOklab(hex1);
        const c2 = hexToOklab(hex2);
        return Math.hypot(c1.L - c2.L, c1.a - c2.a, c1.b - c2.b);
    }

    // Signed shortest arc, so a palette walking one way round the wheel
    // reads as consistent rather than as alternating +350/-10.

        return ((to - from + 180) % 360 + 360) % 360 - 180;

        hslToHex, hexToRgb, rgbToHex, srgbToLinear, linearToSrgb,
        hexToOklab, oklabToLinear, GAMUT_EPS, inGamut, oklabToHex,

// the lightness where a hue reaches its strongest colour: yellow peaks light, blue and violet peak dark
function cuspL(H){const h=Math.round(wrap(H));if(cuspCache[h]!=null)return cuspCache[h];
  let best=.6,bc=0;for(let L=.3;L<=.97;L+=.01){const c=RC.maxChroma(L,h);if(c>bc){bc=c;best=L;}}return cuspCache[h]=best;}
// hue shift along a ramp: lighter leans to yellow, darker leans to blue (sunlight and shade)
function shifted(H,L,amt=16){const t=clamp((L-.6)/.33,-1,1),target=t>0?95:268;
  const d=RC.hueDelta(H,target);return wrap(H+clamp(d,-amt,amt)*Math.abs(t));}
function ramp(H,L0,L1,n,k=.8,why=''){const o=[];for(let i=0;i<n;i++){const L=L0+(L1-L0)*(n>1?i/(n-1):.5);
  const Hs=shifted(H,L);o.push([vivid(L,Hs,k),why]);}return o;}
function neutralRamp(H,L0,L1,n,C=.018,why=''){const o=[];for(let i=0;i<n;i++){const L=L0+(L1-L0)*(n>1?i/(n-1):.5);o.push([lch(L,C,H),why]);}return o;}
const grey=hex=>{const L=RC.hexToOklab(hex).L;return RC.oklchToHex({L,C:0,H:0});};
function closest(p){let m=9;for(let i=0;i<p.length;i++)for(let j=i+1;j<p.length;j++)m=Math.min(m,RC.oklabDistance(p[i],p[j]));return m;}
// one line, ordered round the wheel starting after the widest hue gap; light before dark inside a family; greys last
function lineOrder(items){
  const ch=[],ne=[];items.forEach(it=>{const o=RC.hexToOklch(it[0]);(o.C<.035?ne:ch).push({it,o});});
  ch.sort((a,b)=>a.o.H-b.o.H);let start=0,gap=-1;
  for(let i=0;i<ch.length;i++){const g=wrap(ch[(i+1)%ch.length].o.H-ch[i].o.H)||360;if(g>gap){gap=g;start=(i+1)%ch.length;}}
  const rot=ch.slice(start).concat(ch.slice(0,start));
  // group into 30-degree families along the rotated order, light to dark inside each
  const fam=[];rot.forEach(x=>{const f=fam[fam.length-1];if(f&&RC.hueDelta(f[0].o.H,x.o.H)<30)f.push(x);else fam.push([x]);});
  return fam.flatMap(f=>f.sort((a,b)=>b.o.L-a.o.L)).concat(ne.sort((a,b)=>b.o.L-a.o.L)).map(x=>x.it);
}

// bridges all the way: keep the named controls, put a bridge between every pair, repeat (3 controls, 3 rounds -> 17)
function bridgesAll(ctrl,rounds,mode='blend'){let p=ctrl.map(([n,h])=>[h,n]);
  for(let k=0;k<rounds;k++){const q=[p[0]];for(let i=1;i<p.length;i++){q.push([RC.midpointColor(p[i-1][0],p[i][0],mode),'bridge']);q.push(p[i]);}p=q;}
  return p;}
function biome([n,sub,A,B,C]){return family(A).concat(family(B),family(C));}

 {id:'line',name:'Bridges all the way',src:'"Lines in colour space" (arXiv 1709.02252: straight-line palettes were preferred) built Radiance\'s way: two control colours, a dark cool one and a light warm one, and every colour between is a bridge, then bridges of bridges.',

   let p=[a,b];for(let k=0;k<3;k++){const q=[p[0]];for(let i=1;i<p.length;i++){q.push(RC.midpointColor(p[i-1],p[i],'wheel'));q.push(p[i]);}p=q;}

/* ---- recipes: every palette is FAMILIES of named controls plus rounds of bridges. The list and the maker both
   build colours from a recipe with build(), so a palette opened in the maker is exactly the one in the list.
   recipe = {families:[{controls:[[name,hex]...], rounds:0-3, mode:'wheel'|'blend'}]} */
function expand(f){let p=f.controls.map(([n,h])=>[h,n]);
  for(let k=0;k<(f.rounds||0);k++){const q=[p[0]];for(let i=1;i<p.length;i++){const A=p[i-1],B=p[i];
    q.push([RC.midpointColor(A[0],B[0],f.mode||'wheel'),k==0&&A[1]&&B[1]?'between '+A[1]+' and '+B[1]:'bridge']);q.push(B);}p=q;}
  return p;}
const build=r=>r.families.flatMap(expand);
const fams=(list,rounds,mode)=>({families:list.map(c=>({controls:c,rounds,mode}))});
const chunks=(items,sizes)=>{let k=0;return{families:sizes.map(n=>({controls:items.slice(k,k+=n).map(([h,w])=>[w,h]),rounds:0,mode:'wheel'}))};};
const withColors=(id,label,recipe)=>({id,label,recipe,colors:build(recipe)});

/* ---- the grouped catalog the picker dials down through: group -> item -> its lines ---- */

  const keep=['Markers','Sunset','Ocean'];
  return[
   {id:'classic',name:'Classic',items:PRESETS.filter(p=>keep.includes(p[0])).map(([n,c])=>({id:'classic:'+slug(n),name:n,sub:'',
     lines:[withColors('classic:'+slug(n),'',{families:[{controls:c.map(h=>['',h]),rounds:0,mode:'wheel'}]})]}))},
   {id:'places',name:'Places',items:BIOMES.map(b=>{const id='place:'+slug(b[0]),x=BIOTA[b[0]],lines=[withColors(id+':land','land',fams([b[2],b[3],b[4]],1,'wheel'))];
     if(x){lines.push(withColors(id+':flora',(x.labels&&x.labels.flora)||'flora',fams(x.flora,1,'wheel')));
           lines.push(withColors(id+':fauna','fauna',fams(x.fauna,1,'wheel')));}
     return{id,name:b[0],sub:b[1],lines};})},
   {id:'skies',name:'Skies',items:SKIES.map(([n,sub,day,dusk,how])=>{const id='sky:'+slug(n),mk=x=>how=='bridges'?fams([x],3,'blend'):fams(x,1,'wheel');
     return{id,name:n,sub,lines:[withColors(id+':day','day',mk(day)),withColors(id+':sunset','sunset',mk(dusk))]};})},
   {id:'fades',name:'Fades',items:FADES.map(([n,sub,c,m])=>({id:'fade:'+slug(n),name:n,sub,lines:[withColors('fade:'+slug(n),'',fams([c],3,m))]}))},

     .concat(TRIS.map(t=>({id:'pair:'+slug(t[0]),name:t[0],sub:'tritone',lines:[withColors('pair:'+slug(t[0]),'',chunks(tri(t),[5,4,3]))]})))},
  ];
}
// a seeded method's result as a recipe: one family, every colour a control (no bridges)
function methodRecipe(k,seed){const m=METHODS[k],r=mulberry32(seed),res=m.make(r,seed%3),items=res.ordered?res.items:lineOrder(res.items);
  if(m.id=='line')return{families:[{controls:[['dark control',items[0][0]],['light control',items.at(-1)[0]]],rounds:3,mode:'wheel'}]}; // keep its build: 2 controls, 3 rounds
  return{families:[{controls:items.map(([h,w])=>[w||'',h]),rounds:0,mode:'wheel'}]};}
return{RC,clamp,wrap,mulberry32,lch,guard,vivid,cuspL,shifted,ramp,neutralRamp,grey,closest,lineOrder,

<script>/* gen/cells.js (copied in by build_lava.py; edit the source file) */
// Cells by competition, shared by cells-lab.html and lava-lab.html.
// Every spot on the paper joins the cell that reaches it best: distance / (size x the cell's
// Fourier-wobbled radius in that direction). The paper is bent first (swirl), so walls curve
// but stay closed. trace() turns any owner function into vector walls.
// State S = { C: [{x, y, sz, A:[3], B:[3]}], WV: [6 waves {ux, uy, f, ph, amp, ax}], A: swirl px, L: swirl size px }
(function () {
  function rng(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

  // K wobble harmonics per cell (2nd..4th), total size <= wob so the radius stays positive
  function wobbleCoeffs(r, wob, K = 3) {
    const A = [], B = []; let tot = 0;
    for (let j = 0; j < K; j++) { const a = (r() - .5) / (j + 1), b = (r() - .5) / (j + 1); A.push(a); B.push(b); tot += Math.abs(a) + Math.abs(b); }
    const f = tot > 0 ? wob / tot : 0;
    for (let j = 0; j < K; j++) { A[j] *= f; B[j] *= f; }
    return { A, B };
  }

  function waves(r) {
    const WV = [];
    for (let j = 0; j < 6; j++) {
      const a = r() * Math.PI * 2;
      WV.push({ ux: Math.cos(a), uy: Math.sin(a), f: (0.7 + r() * 0.6) * (j < 3 ? 1 : 1.9), ph: r() * Math.PI * 2, amp: j < 3 ? 1 : 0.45, ax: j % 3 });
    }
    return WV;
  }

  function warp(x, y, S) {
    let dx = 0, dy = 0; const k = 2 * Math.PI / S.L;
    for (const v of S.WV) {
      const t = Math.sin(k * v.f * (v.ux * x + v.uy * y) + v.ph) * v.amp;
      if (v.ax === 0) dx += t; else if (v.ax === 1) dy += t; else { dx += t * 0.7; dy -= t * 0.7; }
    }
    return [x + S.A * dx * 0.6, y + S.A * dy * 0.6];
  }

  function reach(c, co, si) {
    let v = 1, ck = co, sk = si;
    for (let j = 0; j < c.A.length; j++) { const c2 = ck * co - sk * si, s2 = sk * co + ck * si; ck = c2; sk = s2; v += c.A[j] * ck + c.B[j] * sk; }
    return v;
  }

  function owner(x, y, S) {
    const q = warp(x, y, S); let best = 1e9, bi = 0;
    for (let i = 0; i < S.C.length; i++) {
      const c = S.C[i], dx = q[0] - c.x, dy = q[1] - c.y, d = Math.hypot(dx, dy) || 1e-6;
      const v = d / (c.sz * reach(c, dx / d, dy / d));
      if (v < best) { best = v; bi = i; }
    }
    return bi;
  }

  // The bend must never fold the paper over itself (walls would cross). Largest swirl up to S.A
  // whose stretch stays positive everywhere: Jacobian determinant >= 0.1 on a grid.
  function foldFree(S, W, H, grid = 10) {
    const minDet = A => {
      const T = { ...S, A }; let m = Infinity;
      for (let y = 0; y <= H; y += grid) for (let x = 0; x <= W; x += grid) {
        const p = warp(x, y, T), px = warp(x + 1, y, T), py = warp(x, y + 1, T);
        const det = (px[0] - p[0]) * (py[1] - p[1]) - (px[1] - p[1]) * (py[0] - p[0]);
        if (det < m) m = det;
      }
      return m;
    };
    if (minDet(S.A) >= 0.1) return S.A;
    let lo = 0, hi = S.A;
    for (let i = 0; i < 14; i++) { const m = (lo + hi) / 2; if (minDet(m) >= 0.1) lo = m; else hi = m; }
    return lo;
  }

  // Owners sampled on a grid; each crossing found exactly by bisection; chained into paths
  // between junctions. Closed specks too small to color are dropped (they join the cell around them).
  function trace(ownerAt, W, H, step = 3) {
    const nx = Math.floor(W / step), ny = Math.floor(H / step), gx = W / nx, gy = H / ny;
    const own = new Int16Array((nx + 1) * (ny + 1));
    for (let j = 0; j <= ny; j++) for (let i = 0; i <= nx; i++) own[j * (nx + 1) + i] = ownerAt(i * gx, j * gy);
    const O = (i, j) => own[j * (nx + 1) + i];
    const crossing = (x0, y0, x1, y1, a) => {
      let lo = 0, hi = 1;
      for (let i = 0; i < 12; i++) { const m = (lo + hi) / 2; if (ownerAt(x0 + (x1 - x0) * m, y0 + (y1 - y0) * m) === a) lo = m; else hi = m; }
      const t = (lo + hi) / 2;
      return [x0 + (x1 - x0) * t, y0 + (y1 - y0) * t];
    };
    const pts = new Map(), adj = new Map();
    const node = (key, make) => { if (!pts.has(key)) { pts.set(key, make()); adj.set(key, []); } return key; };
    const link = (a, b) => { adj.get(a).push(b); adj.get(b).push(a); };
    const hEdge = (i, j) => O(i, j) !== O(i + 1, j) ? node('h' + i + ',' + j, () => crossing(i * gx, j * gy, (i + 1) * gx, j * gy, O(i, j))) : null;
    const vEdge = (i, j) => O(i, j) !== O(i, j + 1) ? node('v' + i + ',' + j, () => crossing(i * gx, j * gy, i * gx, (j + 1) * gy, O(i, j))) : null;
    for (let j = 0; j < ny; j++) for (let i = 0; i < nx; i++) {
      const e = [hEdge(i, j), vEdge(i + 1, j), hEdge(i, j + 1), vEdge(i, j)].filter(Boolean);
      if (e.length === 2) link(e[0], e[1]);
      else if (e.length > 2) {
        const ps = e.map(k => pts.get(k));
        const jn = node('j' + i + ',' + j, () => [ps.reduce((s, p) => s + p[0], 0) / ps.length, ps.reduce((s, p) => s + p[1], 0) / ps.length]);
        e.forEach(k => link(jn, k));
      }
    }
    const seen = new Set(), paths = [];
    const ek = (a, b) => a < b ? a + '|' + b : b + '|' + a;
    const walk = (start, next) => {
      const line = [pts.get(start)]; let prev = start, cur = next;
      seen.add(ek(prev, cur));
      while (true) {
        line.push(pts.get(cur));
        const nb = adj.get(cur);
        if (nb.length !== 2) break;
        const nxt = nb[0] === prev ? nb[1] : nb[0];

      paths.map(d => `<path d="${d}"/>`).join('\n') +

  }

  function download(text, name) {

    a.download = name; a.click();

  }

})();

<script>
/* LAVA LAMP (a toy beside the palette page). The palette page hands over the palette in the link

// the palette: from the link, else the last one brought here, else Markers

// ---------- the wax (from lava-lab.html) ----------
const MAXN=128;

// ---------- drawing on the graphics card ----------
const VS=`#version 300 es

const FS=`#version 300 es
precision highp float;
uniform vec2 uRes, uPage;
uniform int uN;

uniform vec3 uInk;

  for (int j = 0; j < 6; j++) {

    if (uWa[j].y < .5) d.x += w; else if (uWa[j].y < 1.5) d.y += w; else { d.x += w * .7; d.y -= w * .7; }

    float c2 = co*co - si*si, s2 = 2.*si*co, c3 = c2*co - s2*si, s3 = s2*co + c2*si, c4 = c3*co - s3*si, s4 = s3*co + c3*si;
    float R = 1. + uA[i].x*c2 + uB[i].x*s2 + uA[i].y*c3 + uB[i].y*s3 + uA[i].z*c4 + uB[i].z*s4;
    float val = r / (uCell[i].z * R);

  vec2 e = min(p, uPage - p); if (uPen > 0.) ink = max(ink, clamp(pen - min(e.x, e.y) / s + .5, 0., 1.));

let prog,U={},rampTex;
const gammaOf=()=>1-.7*+$('spread').value;

  for(let k=0;k<rounds;k++){const n=[r[0]];for(let i=1;i<r.length;i++)n.push(RadianceColor.midpointColor(r[i-1],r[i]),r[i]);r=n;}return r;}

  const ramp=[levelColors[0]];for(let i=1;i<levelColors.length;i++)ramp.push(...bridged(levelColors[i-1],levelColors[i]).slice(1));currentRamp=ramp;
  const px=new Uint8Array(256*4);
  for(let i=0;i<256;i++){const hex=smooth?ramp[Math.round(i/255*(ramp.length-1))]:levelColors[Math.min(i,levelColors.length-1)],rgb=RadianceColor.hexToRgb(hex);px.set([rgb.r,rgb.g,rgb.b,255],i*4);}

  render();requestAnimationFrame(frame);}

// ---------- controls ----------
function labels(){
  for(const id of['size','swirl'])$(id+'O').textContent=$(id).value;
  for(const id of['heat','speed','pen'])$(id+'O').textContent=(+$(id).value).toFixed(1);
  for(const id of['wobble','spread'])$(id+'O').textContent=(+$(id).value).toFixed(2);

for(const id of['spread','heat','speed','swirl','wobble','pen'])$(id).addEventListener('input',()=>{labels();if(id==='swirl')swirlCheck=0;});
$('size').addEventListener('input',()=>{labels();adjustCount();});
$('blend').onclick=()=>{smooth=!smooth;$('blend').textContent=smooth?'Steps':'Smooth';uploadRamp();};
$('flip').onclick=()=>{levelColors=levelColors.slice().reverse();showStrip();uploadRamp();};
$('play').onclick=()=>{playing=!playing;$('play').textContent=playing?'Pause':'Play';};
$('newSeed').onclick=()=>{seed=Math.floor(Math.random()*1e6);init();for(let i=0;i<300;i++)step(1/30);};
const stamp=()=>new Date().toISOString().slice(0,19).replace(/[T:]/g,'-');
function download(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);}
// the picture: drawn again at twice the screen size, read straight after drawing (the lamp keeps no copy)
$('savePng').onclick=()=>{
  const ow=canvas.width,oh=canvas.height,k=2;canvas.width=Math.round(W*k);canvas.height=Math.round(H*k);
  const keep=resize;resize=()=>{};render();resize=keep;
  canvas.toBlob(b=>{if(b)download(b,'licorice-lava-'+stamp()+'.png');},'image/png');
  canvas.width=ow;canvas.height=oh;
};
// the coloring page: this moment's walls traced to vector lines (gen/cells.js), at least 2 px so they print
$('saveSvg').onclick=()=>{const S=state();CELLS.download(CELLS.svgText(CELLS.walls(S,W,H),W,H,Math.max(2,+$('pen').value)),'licorice-lava-'+stamp()+'.svg');};

if(!gl){$('info').textContent='The lava lamp needs WebGL2, which this browser does not offer.';}
else{
  try{
    glSetup();fit();init();labels();showStrip();uploadRamp();
    $('play').textContent=playing?'Pause':'Play';
    for(let i=0;i<300;i++)step(1/30); // warm the lamp up before the first frame
    $('info').textContent=levelColors.length+' colors, coolest to hottest by family: the biggest family is the coolest wax, the accent the hottest.';
    requestAnimationFrame(frame);
  }catch(e){$('info').textContent='The lava lamp could not start on this graphics card.';}
}
</script>
</body></html>

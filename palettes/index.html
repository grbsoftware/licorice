<script>/* vendor/radiance-color.js (copied in by build_palettes.py; edit the source file) */
/* vendored: shared/radiance-color v1.0.0 — do not edit here; change it in Radiance and re-vendor */
// radiance-color -- Radiance's colour engine.
//
// sRGB <-> OKLab / OKLCH, the gamut hull, bridge midpoints, ink and contrast.
// Radiance (github.com/grbsoftware/Radiance) owns this file and loads it as
// is; other projects carry a pinned copy. Change it HERE, never in a copy.
//
// Everything is pure: hex strings and plain numbers in, the same out, no DOM
// and no state. Load it with a <script> tag, paste it into a script, or
// require() it -- it defines one name, RadianceColor.
const RadianceColor = (() => {
    'use strict';

    // HSL to Hex
    function hslToHex(h, s, l) {
        s /= 100;
        l /= 100;
        const a = s * Math.min(l, 1 - l);
        const f = n => {
            const k = (n + h / 30) % 12;
            const color = l - a * Math.max(Math.min(k - 3, 9 - k, 1), -1);
            return Math.round(255 * color).toString(16).padStart(2, '0');
        };
        return `#${f(0)}${f(8)}${f(4)}`.toUpperCase();
    }

    // Parse hex to RGB
    function hexToRgb(hex) {
        const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
        return result ? {
            r: parseInt(result[1], 16),
            g: parseInt(result[2], 16),
            b: parseInt(result[3], 16)
        } : null;
    }

    // RGB to hex
    function rgbToHex(r, g, b) {
        return '#' + [r, g, b].map(x => {
            const hex = Math.round(x).toString(16);
            return hex.length === 1 ? '0' + hex : hex;
        }).join('').toUpperCase();
    }

    // --- OKLab -------------------------------------------------------
    // A bridge is only a bridge if it LOOKS halfway between its anchors,
    // and HSL cannot promise that. HSL's "L" is not perceived lightness:
    // averaging green (#00FF00) and blue (#0000FF) in HSL gives cyan
    // (#00FFFF), which is LIGHTER than both colors it sits between. It
    // does not bridge, it spikes. Measured in perceptual lightness the
    // anchors are 0.866 and 0.452, so the midpoint should read 0.659 --
    // HSL puts it at 0.905, off by 0.246.
    //
    // OKLab is built so that equal numeric steps look like equal steps.
    // The same pair midpoints to #00AABF at 0.675, which is where the eye
    // expects it. Same idea for the anchors themselves: evenly spaced HSL
    // hues range over 0.41 in perceived lightness (red 0.628, green 0.866,
    // blue 0.452), which is why a "smooth" ramp never looked smooth.
    //
    // hslToHex stays, for the initial evenly-spaced anchors. HSL is a fine
    // thing to SPECIFY a starting color in. It is just not a thing to
    // average in, and nothing averages in it any more.

    function srgbToLinear(c) {
        c /= 255;
        return c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4);
    }

    function linearToSrgb(c) {
        const v = c <= 0.0031308 ? 12.92 * c : 1.055 * Math.pow(c, 1 / 2.4) - 0.055;
        return Math.max(0, Math.min(255, v * 255));
    }

    function hexToOklab(hex) {
        const rgb = hexToRgb(hex);
        const r = srgbToLinear(rgb.r), g = srgbToLinear(rgb.g), b = srgbToLinear(rgb.b);

        const l = 0.4122214708 * r + 0.5363325363 * g + 0.0514459929 * b;
        const m = 0.2119034982 * r + 0.6806995451 * g + 0.1073969566 * b;
        const s = 0.0883024619 * r + 0.2817188376 * g + 0.6299787005 * b;

        const l_ = Math.cbrt(l), m_ = Math.cbrt(m), s_ = Math.cbrt(s);

        return {
            L: 0.2104542553 * l_ + 0.7936177850 * m_ - 0.0040720468 * s_,
            a: 1.9779984951 * l_ - 2.4285922050 * m_ + 0.4505937099 * s_,
            b: 0.0259040371 * l_ + 0.7827717662 * m_ - 0.8086757660 * s_
        };
    }

    function oklabToLinear(lab) {
        const l_ = lab.L + 0.3963377774 * lab.a + 0.2158037573 * lab.b;
        const m_ = lab.L - 0.1055613458 * lab.a - 0.0638541728 * lab.b;
        const s_ = lab.L - 0.0894841775 * lab.a - 1.2914855480 * lab.b;

        const l = l_ * l_ * l_, m = m_ * m_ * m_, s = s_ * s_ * s_;

        return [
            +4.0767416621 * l - 3.3077115913 * m + 0.2309699292 * s,
            -1.2684380046 * l + 2.6097574011 * m - 0.3413193965 * s,
            -0.0041960863 * l - 0.7034186147 * m + 1.7076147010 * s
        ];
    }

    // The tolerance is not slop, it is the accuracy of the transform. The
    // OKLab matrices are fitted approximations, so a colour that sits
    // exactly ON the sRGB hull round-trips to a channel a few ten-thousandths
    // the wrong side of zero.
    //
    // At 1e-4 that broke an assumption every bisection here depends on --
    // that the ray out from neutral is in gamut up to one boundary and out
    // after it. Measured along pure blue's ray (L 0.452, H 264.05): in gamut
    // at 85% of its chroma, OUT at 90%, 95% and 99% where linear red reads
    // -0.00063, and in again at 100% where it is exactly 0. A hole in the
    // middle, and a bisection walks straight into it -- maxChroma returned
    // 0.2674 for a colour whose chroma is 0.3132, a 15% underestimate, and
    // oklabToHex used the same pattern to desaturate bridges further than
    // the gamut actually required.
    //
    // 1e-3 clears the transform's own error. In linear light that is well
    // under a quarter of an 8-bit step, and the clamp at the end of
    // oklabToHex catches whatever rounds past the edge.
    const GAMUT_EPS = 1e-3;

    function inGamut(lab) {
        return oklabToLinear(lab).every(c => c >= -GAMUT_EPS && c <= 1 + GAMUT_EPS);
    }

    // OKLab is bigger than sRGB, so a midpoint can land somewhere the screen
    // cannot show. SOMETHING has to give, and the choice of what decides
    // whether the bridge still reads as a bridge.
    //
    // Clamping each channel at the end -- the obvious way, and what this did
    // -- gives away lightness and hue, the two properties the whole OKLab
    // change was made to protect. Measured over every bridge the presets
    // produce, 23 land outside sRGB and clamping moved them up to 3.6 deg in
    // hue and 0.014 in L. The green -> blue midpoint from the notes above
    // came out at L 0.676 against a target of 0.659; that residual was
    // blamed on "gamut clipping" and this is the clipping it meant.
    //
    // Reducing CHROMA instead gives away saturation, which is the one thing
    // a bridge does not promise. Same 23 colors: worst hue shift 0.9 deg,
    // worst L error 0.0009 -- fifteen times closer. Green -> blue now lands
    // at 0.659 exactly, so the residual is gone rather than explained.
    function oklabToHex(lab) {
        let out = lab;
        if (!inGamut(lab)) {
            let lo = 0, hi = 1;
            for (let i = 0; i < 24; i++) {
                const mid = (lo + hi) / 2;
                if (inGamut({ L: lab.L, a: lab.a * mid, b: lab.b * mid })) lo = mid;
                else hi = mid;
            }
            out = { L: lab.L, a: lab.a * lo, b: lab.b * lo };
        }
        // Still clamp: chroma reduction cannot rescue an L outside [0,1],
        // and rounding leaves channels a hair over.
        return rgbToHex(...oklabToLinear(out).map(c => linearToSrgb(Math.max(0, Math.min(1, c)))));
    }

    // --- Bridge policy ----------------------------------------------
    // Both midpoints below are in OKLab and both are perceptually honest.
    // They differ in what they treat as the thing being halved.
    //
    // BLEND averages a and b as coordinates: the true midpoint of the two
    // colors as POINTS. a and b are signed, so as the anchors' hues diverge
    // the two vectors point apart and partly cancel -- gold and navy are
    // both strongly colored and their blend is #7E7D70, a drab olive grey.
    // Nothing is out of gamut there; the saturation was destroyed by the
    // arithmetic. Across the shipped presets, 12 bridges lose more than half
    // their anchors' chroma this way.
    //
    // WHEEL averages lightness and chroma as scalars and walks hue around
    // the shorter arc: the midpoint of the two HUES. Chroma at the bridge is
    // the mean of the two chromas by construction, so it cannot collapse and
    // cannot exceed the colors it sits between. Gold -> navy becomes #009083.
    //
    // Neither is a better version of the other, which is the test a setting
    // has to pass to deserve existing. Blend answers "what color is halfway
    // between these two", wheel answers "what color is halfway around from
    // one to the other". Blend stays the default because it is what every
    // saved palette was built with.
    //
    // NOT OFFERED: pushing chroma out to the gamut hull. It was measured and
    // it is a trap -- the headroom is largest exactly where hue means least.
    // Two pale neutrals whose midpoint chroma is 0.002 have 89x of it, and
    // spending it turns a soft grey into #C3FF3B. At C near zero the hue is
    // arbitrary, so amplifying it invents a color rather than finding one.

    function midpointColor(hex1, hex2, mode = 'blend') {
        const c1 = hexToOklab(hex1);
        const c2 = hexToOklab(hex2);

        const h = (H === null ? 0 : H) / DEG;

function duo([name,a,b,why]){
  const A=a==null?neutralRamp(60,.2,.62,5,.012,'family 1 (dark-led): neutral ink'):ramp(a,.27,.72,5,.85,'family 1, led dark');
  const B=ramp(b,.58,.95,5,.85,'family 2, led light');
  return A.concat(B);
}
function tri([name,a,b,c]){
  const A=a==null?neutralRamp(60,.2,.6,5,.012,'family 1: neutral ink'):ramp(a,.27,.7,5,.85,'family 1, led dark');
  const B=ramp(b,.6,.95,4,.8,'family 2, led light');
  const C=ramp(c,.5,.78,3,.9,'family 3: the accent, small amounts');
  return A.concat(B,C);
}

/* ---- 4. methods (seeded) ---- */
const METHODS=[
 {id:'wheel',name:'Wheel rules',src:'Adobe Color / Itten: hues placed by angle (analogous, split complement, triad, complement), each at a few lightnesses. O\'Donovan 2011: these templates alone don\'t predict which palettes people like. Shown as the baseline.',
  make(r){const H=r()*360,rules=[['analogous',[0,30,60]],['split complement',[0,150,210]],['triad',[0,120,240]],['complement',[0,180]]],[rn,off]=rules[Math.floor(r()*rules.length)];
   const out=[];off.forEach(d=>{const n=off.length==2?5:4;for(let i=0;i<n;i++){const L=.42+.46*i/(n-1);out.push([vivid(L,H+d,.75),rn+' '+(d?'+'+d+'°':'base')]);}});return{items:out,tag:rn};}},
 {id:'natural',name:'Natural order',src:'Judd / Munsell: each hue sits at its own natural lightness, where it is strongest (yellow light, orange mid, blue and violet dark). Pairs that follow this order look right; reversed (dark yellow, pale navy) looks muddy.',
  make(r){const H=r()*360,n=4+Math.floor(r()*2),step=25+r()*20,out=[];
   for(let i=0;i<n;i++){const h=H+i*step,L=clamp(cuspL(h)+(r()-.5)*.08,.3,.93);out.push([vivid(L,h,.9),'hue at its natural lightness']);
     out.push([vivid(clamp(L+.17,.4,.96),shifted(h,L+.17),.6),'its tint (towards sunlight)']);}
   const h0=H+step*(n-1)/2;out.push([vivid(.3,shifted(h0,.3),.7),'one deep shade for edges']);return{items:out,tag:n+' hues, '+Math.round(step)+'° apart'};}},
 {id:'line',name:'Bridges all the way',src:'"Lines in colour space" (arXiv 1709.02252: straight-line palettes were preferred) built Radiance\'s way: two control colours, a dark cool one and a light warm one, and every colour between is a bridge, then bridges of bridges.',
  make(r){const Hd=200+r()*110,Hl=Hd+180+(r()-.5)*90;const a=vivid(.28,Hd,.9),b=vivid(.92,Hl,.9);
   let p=[a,b];for(let k=0;k<3;k++){const q=[p[0]];for(let i=1;i<p.length;i++){q.push(RC.midpointColor(p[i-1],p[i],'wheel'));q.push(p[i]);}p=q;}
   return{items:p.map((h,i)=>[h,i==0||i==p.length-1?'control colour':'bridge (wheel)']),tag:'9 from 2 controls',ordered:true};}},
 {id:'pigment',name:'Limited pigments',src:'Painters\' limited palettes (Zorn: ochre, vermilion, black, white; split primary; earth). Every swatch is a mix of a few real pigments, so everything shares the same ingredients. Mixed here in OKLab as an approximation of paint.',
  sets:[['Zorn',{ochre:'#c8963e',vermilion:'#e34234','ivory black':'#28241f',white:'#f5f2ea'}],
        ['Earth + blue',{'burnt sienna':'#8a3e1e','yellow ochre':'#cf9a3a',ultramarine:'#2a3a9a',white:'#f6f3ec'}],
        ['Split primary',{lemon:'#f4e04d','cad yellow':'#f6b12a','cad red':'#e0352b',alizarin:'#a3203f',ultramarine:'#2a3a9a',phthalo:'#0f5b78',white:'#f7f5ef'}]],
  make(r,i){const [nm,pg]=this.sets[i%3],names=Object.keys(pg).filter(k=>k!='white'),W=pg.white,out=[];
   const mix=(x,y,t)=>{const A=RC.hexToOklab(x),B=RC.hexToOklab(y);return RC.oklabToHex({L:A.L+(B.L-A.L)*t,a:A.a+(B.a-A.a)*t,b:A.b+(B.b-A.b)*t});};
   names.forEach(n=>out.push([pg[n],n]));
   for(let a=0;a<names.length;a++)for(let b=a+1;b<names.length;b++){const t=.35+r()*.3;out.push([mix(pg[names[a]],pg[names[b]],t),names[a]+' + '+names[b]]);}
   names.forEach(n=>out.push([mix(pg[n],W,.55),n+' + white']));
   let o=out;while(o.length>14){o.splice(Math.floor(r()*(o.length-names.length))+names.length,1);} // keep the pure pigments
   return{items:o,tag:nm};}},
 {id:'notan',name:'Quiet, middle, loud',src:'Munsell\'s area rule (large areas quiet, small areas strong) and the colourists\' 60-30-10: one quiet family for big fields across the whole value range, one middle family, one loud accent used sparingly.',
  make(r){const H=r()*360,H2=H+(r()<.5?1:-1)*(30+r()*30),H3=H+150+r()*60,out=[];
   for(let i=0;i<6;i++){const L=.3+.62*i/5;out.push([lch(L,.035+.02*r(),guard(L,shifted(H,L))),'quiet: big fields']);}
   for(let i=0;i<4;i++){const L=.45+.4*i/3;out.push([vivid(L,shifted(H2,L),.55),'middle: medium areas']);}
   const L3=cuspL(H3);out.push([vivid(L3,H3,.95),'loud: small touches']);out.push([vivid(clamp(L3-.15,.35,.8),H3,.95),'loud, darker']);
   return{items:out,tag:'60 / 30 / 10',ordered:true};}},

/* ---- suggestions for the next control colour (the maker's five rules) ---- */
const warm=H=>H<110||H>330;
const SUGGEST=[
 ['Next in natural order','turns the wheel 35° onward and puts that hue at its natural lightness',a=>{const o=RC.hexToOklch(a.at(-1)),p=a.length>1?RC.hexToOklch(a.at(-2)):null;
   const dir=p&&o.H!=null&&p.H!=null?Math.sign(RC.hueDelta(p.H,o.H))||1:1,H=(o.H??60)+35*dir;return vivid(cuspL(H),H,.88);}],
 ['Light–dark see-saw','stays close in hue (20° on) but flips the value: light after dark, dark after light',a=>{const o=RC.hexToOklch(a.at(-1)),H=(o.H??60)+20,L=o.L>.6?.32:.88;return vivid(L,shifted(H,L),.85);}],
 ['Warm ↔ cool','crosses to the other temperature, at a contrasting value',a=>{const o=RC.hexToOklch(a.at(-1)),H=o.H??60,T=warm(H)?235:62,L=clamp(o.L>.6?o.L-.3:o.L+.3,.3,.92);return vivid(L,shifted(T,L),.85);}],
 ['Continue the line','extends the straight line through the last two controls (needs two)',a=>{if(a.length<2)return null;const x=RC.hexToOklab(a.at(-2)),y=RC.hexToOklab(a.at(-1));
   const L=clamp(2*y.L-x.L,.22,.95);return RC.oklabToHex({L,a:2*y.a-x.a,b:2*y.b-x.b});}],
 ['Accent','the colour opposite your controls, at full strength: for the one field that breaks the rule',a=>{let sa=0,sb=0;a.forEach(h=>{const o=RC.hexToOklab(h);sa+=o.a;sb+=o.b;});
   const H=wrap(Math.atan2(sb,sa)*180/Math.PI+180);return vivid(cuspL(H),H,.95);}],

/* ---- recipes: every palette is FAMILIES of named controls plus rounds of bridges. The list and the maker both
   build colours from a recipe with build(), so a palette opened in the maker is exactly the one in the list.
   recipe = {families:[{controls:[[name,hex]...], rounds:0-3, mode:'wheel'|'blend'}]} */
function expand(f){let p=f.controls.map(([n,h])=>[h,n]);
  for(let k=0;k<(f.rounds||0);k++){const q=[p[0]];for(let i=1;i<p.length;i++){const A=p[i-1],B=p[i];
    q.push([RC.midpointColor(A[0],B[0],f.mode||'wheel'),k==0&&A[1]&&B[1]?'between '+A[1]+' and '+B[1]:'bridge']);q.push(B);}p=q;}
  return p;}
const build=r=>r.families.flatMap(expand);
const fams=(list,rounds,mode)=>({families:list.map(c=>({controls:c,rounds,mode}))});
const chunks=(items,sizes)=>{let k=0;return{families:sizes.map(n=>({controls:items.slice(k,k+=n).map(([h,w])=>[w,h]),rounds:0,mode:'wheel'}))};};
const withColors=(id,label,recipe)=>({id,label,recipe,colors:build(recipe)});

/* ---- the grouped catalog the picker dials down through: group -> item -> its lines ---- */
const slug=t=>t.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
function catalog(){
  const keep=['Markers','Sunset','Ocean'];
  return[
   {id:'classic',name:'Classic',items:PRESETS.filter(p=>keep.includes(p[0])).map(([n,c])=>({id:'classic:'+slug(n),name:n,sub:'',
     lines:[withColors('classic:'+slug(n),'',{families:[{controls:c.map(h=>['',h]),rounds:0,mode:'wheel'}]})]}))},
   {id:'places',name:'Places',items:BIOMES.map(b=>{const id='place:'+slug(b[0]),x=BIOTA[b[0]],lines=[withColors(id+':land','land',fams([b[2],b[3],b[4]],1,'wheel'))];
     if(x){lines.push(withColors(id+':flora',(x.labels&&x.labels.flora)||'flora',fams(x.flora,1,'wheel')));
           lines.push(withColors(id+':fauna','fauna',fams(x.fauna,1,'wheel')));}
     return{id,name:b[0],sub:b[1],lines};})},
   {id:'skies',name:'Skies',items:SKIES.map(([n,sub,day,dusk,how])=>{const id='sky:'+slug(n),mk=x=>how=='bridges'?fams([x],3,'blend'):fams(x,1,'wheel');
     return{id,name:n,sub,lines:[withColors(id+':day','day',mk(day)),withColors(id+':sunset','sunset',mk(dusk))]};})},
   {id:'fades',name:'Fades',items:FADES.map(([n,sub,c,m])=>({id:'fade:'+slug(n),name:n,sub,lines:[withColors('fade:'+slug(n),'',fams([c],3,m))]}))},
   {id:'pairs',name:'Pairs',items:DUOS.map(d=>({id:'pair:'+slug(d[0]),name:d[0],sub:'duotone',lines:[withColors('pair:'+slug(d[0]),'',chunks(duo(d),[5,5]))]}))
     .concat(TRIS.map(t=>({id:'pair:'+slug(t[0]),name:t[0],sub:'tritone',lines:[withColors('pair:'+slug(t[0]),'',chunks(tri(t),[5,4,3]))]})))},
  ];
}
// a seeded method's result as a recipe: one family, every colour a control (no bridges)
function methodRecipe(k,seed){const m=METHODS[k],r=mulberry32(seed),res=m.make(r,seed%3),items=res.ordered?res.items:lineOrder(res.items);
  if(m.id=='line')return{families:[{controls:[['dark control',items[0][0]],['light control',items.at(-1)[0]]],rounds:3,mode:'wheel'}]}; // keep its build: 2 controls, 3 rounds
  return{families:[{controls:items.map(([h,w])=>[w||'',h]),rounds:0,mode:'wheel'}]};}
return{RC,clamp,wrap,mulberry32,lch,guard,vivid,cuspL,shifted,ramp,neutralRamp,grey,closest,lineOrder,
  PRESETS,BIOMES,BIOTA,SKIES,FADES,DUOS,TRIS,family,bridgesAll,biome,duo,tri,METHODS,catalog,SUGGEST,warm,expand,build,methodRecipe};
})();

<script>
const P=PSETS,RC=RadianceColor;
const store={get(k){try{return localStorage.getItem(k);}catch(e){return null;}},set(k,v){try{localStorage.setItem(k,v);}catch(e){}}};
const us=t=>String(t).replace(/([Cc])olour/g,'$1olor'); // the palette data's notes use 'colour'; this page speaks like the app
const esc=t=>us(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const HEX=/^#[0-9a-f]{6}$/i,MAXC=24; // MAXC: most colors a palette may have
/* Anything that was not built on this page in this visit (storage, a shared link) is checked before use:
   a recipe is families of [name, #rrggbb] controls, 0-3 rounds, wheel or blend, 24 colors at most. */
function cleanRecipe(r){if(!r||!Array.isArray(r.families)||!r.families.length||r.families.length>8)return null;const fams=[];let n=0;
  for(const f of r.families){if(!f||!Array.isArray(f.controls)||!f.controls.length||f.controls.length>MAXC)return null;const cs=[];
    for(const c of f.controls){if(!Array.isArray(c)||!HEX.test(c[1]))return null;cs.push([String(c[0]??'').slice(0,60),c[1].toLowerCase()]);}
    const rounds=[0,1,2,3].includes(f.rounds)?f.rounds:0;let m=cs.length;for(let k=0;k<rounds;k++)m=2*m-1;n+=m;
    fams.push({controls:cs,rounds,mode:f.mode=='blend'?'blend':'wheel'});}
  return n>96?null:{families:fams};}
const readArr=k=>{try{const v=JSON.parse(store.get(k)||'[]');return Array.isArray(v)?v:[];}catch(e){return[];}};
const readMine=()=>readArr('licorice-pal-mine').map(m=>{const r=m&&cleanRecipe(m.recipe);return r&&/^mine:[a-z0-9]+$/.test(m.id)?{id:m.id,name:String(m.name||'My palette').slice(0,60),recipe:r}:null;}).filter(Boolean);
const readIds=k=>readArr(k).filter(x=>typeof x=='string'&&x.length<80);
const readSets=()=>readArr('licorice-pal-app-sets').filter(x=>x&&Array.isArray(x.picks)).map(x=>({id:String(x.id||''),name:String(x.name||'Combination').slice(0,60),picks:x.picks.filter(p=>typeof p=='string'&&p.length<80).slice(0,3)}));
let mine=readMine();
let CAT=[];
function rebuildCat(){CAT=P.catalog();
  if(mine.length)CAT.unshift({id:'mine',name:'My palettes',items:mine.map(m=>({id:m.id,name:m.name,sub:'',mine:true,lines:[{id:m.id,label:'',recipe:m.recipe,colors:P.build(m.recipe)}]}))});}
rebuildCat();
let view='list',path=[],loadMode=false;
let cur=store.get('licorice-pal-line')||'classic:markers',pick=0,pickSet=false; // pickSet: the person tapped a color in Your palette (Ripple builds its run around it)
let draft=null; // {name, recipe, from (id of a saved one being edited)}
try{draft=JSON.parse(store.get('licorice-pal-draft')||'null');if(draft){const r=cleanRecipe(draft.recipe);draft=r?{name:String(draft.name||'').slice(0,60),recipe:r,from:mine.some(m=>m.id==draft.from)?draft.from:null}:null;}}catch(e){draft=null;}
const saveDraft=()=>store.set('licorice-pal-draft',JSON.stringify(draft));
const findLine=id=>{if(id=='draft'&&draft)return{it:{name:draft.name||'Your draft'},ln:{label:'not saved',recipe:draft.recipe,colors:P.build(draft.recipe)}};
  // a New mix rolled in the app ('nmix:<n>'): one of the five methods, seeded, so both pages build the same colors
  if(/^nmix:\d{1,9}$/.test(id)){const n=+id.slice(5),k=n%P.METHODS.length,r=P.methodRecipe(k,n);return{it:{name:P.METHODS[k].name+' '+n,sub:'New mix from the app'},ln:{id,label:'',recipe:r,colors:P.build(r)}};}
  for(const g of CAT)for(const it of g.items)for(const ln of it.lines)if(ln.id==id)return{g,it,ln};return null;};
const strip=(cols,cls='strip',mark=-1)=>'<div class="'+cls+'">'+cols.map((c,k)=>'<i style="background:'+c[0]+(k==mark?';box-shadow:inset 0 0 0 2px #fff,inset 0 0 0 4px #000':'')+'" title="'+esc((c[1]?c[1]+' ':'')+c[0])+'"></i>').join('')+'</div>';
const clone=o=>JSON.parse(JSON.stringify(o));
/* TAKE TO THE APP (Gary 2026-10-06): this page is where people play; they pick up to 3 palettes and only those show
   in the app, so switching while coloring is one tap. Stored by line id; both pages share it (same site). */
const MAXPICK=3;let picks=readIds('licorice-pal-app-picks').slice(0,MAXPICK);
/* COMBINATIONS (Gary): the picks can be saved under a name and brought back as a group. */
let sets=readSets(),lastGone=null;
const saveSets=()=>{store.set('licorice-pal-app-sets',JSON.stringify(sets));renderPicks();};
const sameSet=a=>a.length==picks.length&&a.every((x,i)=>x==picks[i]);
/* SHARING a combination: a link whose #set= carries the name and the three palettes. List palettes travel as their
   stable ids (a few characters); a home-made one travels as its recipe, so it rebuilds the same on any device. */
const b64e=o=>btoa(unescape(encodeURIComponent(JSON.stringify(o)))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const b64d=t=>JSON.parse(decodeURIComponent(escape(atob(t.replace(/-/g,'+').replace(/_/g,'/')))));
function shareLink(set){const p=set.picks.map(id=>{if(id.startsWith('mine:')){const m=mine.find(x=>x.id==id);return m?{n:m.name,r:m.recipe}:null;}return id;}).filter(Boolean);
  return location.origin+location.pathname+'#set='+b64e({n:set.name,p});}
let gift=null; // a combination someone shared with you, waiting for Add / No thanks
try{const m=location.hash.match(/^#set=(.+)$/);if(m&&m[1].length<20000){const o=b64d(m[1]);if(o&&Array.isArray(o.p)){
  // list palettes must be ids this page knows; home-made ones must be well-formed recipes of a size the maker could have saved
  const p=o.p.slice(0,MAXPICK).map(x=>{if(typeof x=='string')return x.length<80?x:null;const r=x&&cleanRecipe(x.r);return r&&P.build(r).length<=MAXC?{n:String(x.n||'Shared palette').slice(0,60),r}:null;}).filter(Boolean);
  if(p.length)gift={n:String(o.n||'').slice(0,60),p};}}}catch(e){}
let sharing=-1; // which combination's link is showing
/* the APP's palette bar (previewed above the sample): its combination menu and the three palettes, one tap each */
function renderAppbar(){const el=document.getElementById('appbar'),on=sets.findIndex(x=>sameSet(x.picks));
  let h='<div class="meta lbl">In the app</div>';
  if(sets.length)h+='<select id="appSet" title="Switch combination">'+(on<0?'<option value="-1">Not saved</option>':'')+sets.map((x,k)=>'<option value="'+k+'"'+(k==on?' selected':'')+'>'+esc(x.name)+'</option>').join('')+'</select>';
  picks.forEach(id=>{const f=findLine(id);h+='<button class="ap'+(id==cur?' on':'')+'" data-ap="'+esc(id)+'" title="'+esc(f.it.name+(f.ln.label?' · '+f.ln.label:''))+'">'+strip(f.ln.colors)+'</button>';});
  if(!picks.length)h+='<span class="meta">no palettes taken yet</span>';
  el.innerHTML=h;
  const sel=el.querySelector('#appSet');if(sel)sel.onchange=()=>{const k=+sel.value;if(k<0)return;picks=sets[k].picks.filter(id=>findLine(id));if(picks[0]){cur=picks[0];pick=0;pickSet=false;store.set('licorice-pal-line',cur);}savePicks();};
  el.querySelectorAll('[data-ap]').forEach(b=>b.onclick=()=>{cur=b.dataset.ap;pick=0;pickSet=false;store.set('licorice-pal-line',cur);renderPicks();render();renderCur();});}
const savePicks=()=>{store.set('licorice-pal-app-picks',JSON.stringify(picks));renderPicks();render();renderCur();};
function renderPicks(){picks=picks.filter(id=>findLine(id));let h='';
  if(gift){const ok=gift.p.map(x=>typeof x=='string'?findLine(x)&&findLine(x).ln.colors:x.r?P.build(x.r):null).filter(Boolean);
    h+='<div class="gift"><b>Shared with you: “'+esc(gift.n||'A combination')+'”</b><div class="mini" style="margin:6px 0">'+ok.map(c=>strip(c)).join('')+'</div><div class="mk-row" style="padding:0"><button class="b pri" data-gift>Add it</button><button class="b" data-nogift>No thanks</button></div></div>';}
  h+='<h2>In the app ('+picks.length+' of '+MAXPICK+')</h2>';
  picks.forEach((id,k)=>{const f=findLine(id);h+='<div class="slot"><button class="pk'+(id==cur?' on':'')+'" data-pk="'+esc(id)+'"><span>'+esc(f.it.name+(f.ln.label?' · '+f.ln.label:''))+'</span>'+strip(f.ln.colors)+'</button><button class="x" data-unpk="'+k+'" title="Take it out of the app">✕</button></div>';});
  for(let k=picks.length;k<MAXPICK;k++)h+='<div class="slot empty">'+(k==picks.length?'Open a palette and Take it to the app':'empty')+'</div>';
  const savedAs=sets.find(x=>sameSet(x.picks));
  h+='<div class="mk-row" style="padding:8px 0 0">'+(savedAs?'<span class="meta">Saved as “'+esc(savedAs.name)+'”</span>':
    '<input id="setName" class="mk-name" style="flex:1;width:auto" placeholder="Name this combination"><button class="b pri" data-saveset '+(picks.length?'':'disabled')+'>Save combination</button>')+'</div>';
  if(sets.length||lastGone){h+='<div class="sets"><h2>Your combinations</h2>';
    sets.forEach((x,k)=>{h+='<div class="set"><button class="pk'+(sameSet(x.picks)?' on':'')+'" data-loadset="'+k+'"><b>'+esc(x.name)+'</b>'+x.picks.filter(id=>findLine(id)).map(id=>strip(findLine(id).ln.colors)).join('')+'</button><button class="x" data-shareset="'+k+'" title="Share this combination">↗</button><button class="x" data-delset="'+k+'" title="Delete this combination">✕</button></div>';
      if(sharing==k)h+='<div class="mk-row" style="padding:4px 0"><input class="share" readonly value="'+esc(shareLink(x))+'"><span class="meta" id="shareMsg">Copied. Anyone who opens this link gets the same three palettes.</span></div>';});
    if(lastGone)h+='<div class="mk-row" style="padding:6px 0 0"><span class="meta">Deleted “'+esc(lastGone.set.name)+'”.</span><button class="b" data-undoset>Undo</button></div>';
    h+='</div>';}
  const el=document.getElementById('picks');el.innerHTML=h;
  el.querySelectorAll('[data-pk]').forEach(b=>b.onclick=()=>{cur=b.dataset.pk;pick=0;pickSet=false;store.set('licorice-pal-line',cur);renderPicks();render();renderCur();});
  el.querySelectorAll('[data-unpk]').forEach(b=>b.onclick=()=>{picks.splice(+b.dataset.unpk,1);savePicks();});
  el.querySelectorAll('[data-saveset]').forEach(b=>b.onclick=()=>{const name=(el.querySelector('#setName').value||'').trim()||'Combination '+(sets.length+1);
    sets.push({id:'set:'+Date.now().toString(36),name,picks:picks.slice()});lastGone=null;saveSets();});
  el.querySelectorAll('[data-loadset]').forEach(b=>b.onclick=()=>{picks=sets[+b.dataset.loadset].picks.filter(id=>findLine(id));if(picks[0]){cur=picks[0];pick=0;pickSet=false;store.set('licorice-pal-line',cur);}savePicks();});
  el.querySelectorAll('[data-delset]').forEach(b=>b.onclick=()=>{const k=+b.dataset.delset;lastGone={set:sets[k],at:k};sets.splice(k,1);saveSets();});
  el.querySelectorAll('[data-shareset]').forEach(b=>b.onclick=()=>{const k=+b.dataset.shareset;sharing=sharing==k?-1:k;renderPicks();
    if(sharing==k){const inp=document.querySelector('#picks .share');inp.select();(navigator.clipboard?navigator.clipboard.writeText(inp.value):Promise.reject()).catch(()=>{const m=document.getElementById('shareMsg');if(m)m.textContent='Select the link and copy it.';});}});
  el.querySelectorAll('[data-gift]').forEach(b=>b.onclick=()=>{const ids=gift.p.map(x=>{if(typeof x=='string')return findLine(x)?x:null;
      const id='mine:'+Date.now().toString(36)+Math.floor(Math.random()*1e4);mine.push({id,name:x.n||'Shared palette',recipe:x.r});return id;}).filter(Boolean);
    store.set('licorice-pal-mine',JSON.stringify(mine));rebuildCat();sets.push({id:'set:'+Date.now().toString(36),name:gift.n||'Shared combination',picks:ids});
    picks=ids.slice(0,MAXPICK);gift=null;path=[];history.replaceState(null,'',location.pathname);store.set('licorice-pal-app-sets',JSON.stringify(sets));savePicks();});
  el.querySelectorAll('[data-nogift]').forEach(b=>b.onclick=()=>{gift=null;history.replaceState(null,'',location.pathname);renderPicks();});
  renderAppbar();
  el.querySelectorAll('[data-undoset]').forEach(b=>b.onclick=()=>{sets.splice(lastGone.at,0,lastGone.set);lastGone=null;saveSets();});}

/* ---------- the list: groups -> items -> lines ---------- */
/* SORTING (Gary): besides the groups, the list can be one ranked list:
   NEAR A COLOUR: by how close the palette's nearest color comes to a color you choose (that color is outlined)
   GOES WITH YOURS: by how many colors a palette shares with your current one (for each color, the distance to the
   nearest color in the other palette, both ways, averaged), so the top ones sit well beside it in a combination. */
let sortMode=store.get('licorice-pal-sort')||'groups',sortCol=store.get('licorice-pal-sort-col')||'#3f7f5a';if(!HEX.test(sortCol))sortCol='#3f7f5a';if(!['groups','color','goes'].includes(sortMode))sortMode='groups';
let sortMore=false,sortRef=null; // sortRef: the palette 'Goes with' ranks against
const allLines=()=>CAT.flatMap(g=>g.items.flatMap(it=>it.lines.map(ln=>({g,it,ln}))));
function nearestTo(cols,hex){let bi=0,bd=1e9;cols.forEach((c,i)=>{const d=RC.oklabDistance(c[0],hex);if(d<bd){bd=d;bi=i;}});return[bd,bi];}
function sharedDist(A,B){const half=(X,Y)=>X.reduce((s,c)=>s+nearestTo(Y,c[0])[0],0)/X.length;return(half(A,B)+half(B,A))/2;}
function ranked(){const L=allLines();
  if(sortMode=='color')return L.map(x=>{const[d,i]=nearestTo(x.ln.colors,sortCol);return{...x,score:d,mark:i};}).sort((a,b)=>a.score-b.score);
  if(!sortRef||!findLine(sortRef))sortRef=cur;const me=findLine(sortRef)||findLine('classic:markers'),A=me.ln.colors;
  return L.filter(x=>x.ln.id!=sortRef).map(x=>({...x,score:sharedDist(A,x.ln.colors),mark:-1})).sort((a,b)=>a.score-b.score);}
let goneMine=null; // the last deleted home-made palette, for Undo
const goneNote=()=>goneMine?'<div class="mk-row"><span class="meta">Deleted “'+esc(goneMine.m.name)+'”.</span><button class="b" data-undomine>Undo</button></div>':'';
function renderList(){
  let h='';
  if(path.length==0){
    if(loadMode)h+='<div class="crumb"><button class="back" data-cancel>‹ Back to the maker</button></div><div class="title">Start from…</div><div class="note" style="padding-top:0">Pick any palette; it opens in the maker with its own build, ready to change.</div>';
    else{h+='<div class="title">Palettes</div><button class="rowb make" data-make><div class="t"><b>Make your own</b><span>›</span></div><div class="s">Start blank, from any palette, or roll one of the five methods</div></button>'+goneNote();}
    h+='<div class="sortbar"><span class="seg">Sort '+[['groups','Groups'],['color','Near a color'],['goes','Goes with yours']].map(([m,t])=>'<button class="'+(sortMode==m?'on':'')+'" data-sort="'+m+'">'+t+'</button>').join('')+'</span>'+
      (sortMode=='color'?'<input type="color" class="sw" id="sortCol" value="'+sortCol+'" title="Choose a color">':'')+'</div>';
    if(sortMode=='groups')CAT.forEach((g,k)=>{h+='<button class="rowb" data-g="'+k+'"><div class="t"><b>'+g.name+'</b><span>'+g.items.length+' ›</span></div>'+
      '<div class="mini">'+g.items.slice(0,3).map(it=>strip(it.lines[0].colors)).join('')+'</div></button>';});
    else{const R=ranked(),show=sortMore?R:R.slice(0,20);
      if(sortMode=='goes'){const me=findLine(sortRef)||findLine('classic:markers');h+='<div class="note" style="padding-top:0">Sharing the most colors with <b>'+esc(me.it.name+(me.ln.label?' · '+me.ln.label:''))+'</b> first.'+(cur!=sortRef&&cur!='draft'?' <button class="b" data-reref>Goes with the one I am on</button>':'')+'</div>';}
      show.forEach(x=>{const why=sortMode=='color'?'closest: '+(x.ln.colors[x.mark][1]&&!/^(bridge|between)/.test(x.ln.colors[x.mark][1])?x.ln.colors[x.mark][1]:x.ln.colors[x.mark][0]):'';
        h+='<button class="rowb'+(!loadMode&&x.ln.id==cur?' on':'')+'" data-l="'+esc(x.ln.id)+'"><div class="t"><b>'+esc(x.it.name+(x.ln.label?' · '+x.ln.label:''))+'</b><span>'+esc(x.g.name)+(picks.includes(x.ln.id)?' · <span class="tag">in the app</span>':'')+'</span></div>'+
          (why?'<div class="s">'+esc(why)+'</div>':'')+strip(x.ln.colors,'strip',x.mark)+'</button>';});
      if(!sortMore&&R.length>20)h+='<div class="mk-row"><button class="b" data-sortmore>Show all '+R.length+'</button></div>';}
  }else if(path.length==1){
    const g=CAT[path[0]];
    h+='<div class="crumb"><button class="back" data-up>‹ '+(loadMode?'Start from…':'Palettes')+'</button></div><div class="title">'+g.name+'</div>'+(g.id=='mine'&&!loadMode?goneNote():'');
    g.items.forEach((it,k)=>{const multi=it.lines.length>1,on=!loadMode&&it.lines.some(l=>l.id==cur),del=it.mine&&!loadMode;
      h+=(del?'<div class="minerow">':'')+'<button class="rowb'+(on?' on':'')+'" '+(multi?'data-i="'+k+'"':'data-l="'+it.lines[0].id+'"')+'><div class="t"><b>'+esc(it.name)+'</b>'+
        (it.lines.some(l=>picks.includes(l.id))?'<span class="tag">in the app</span>':'')+(multi?'<span class="more">'+it.lines.length+' lines ›</span>':'')+'</div>'+(it.sub?'<div class="s">'+it.sub+'</div>':'')+strip(it.lines[0].colors)+'</button>'+
        (del?'<button class="x" data-delmine="'+esc(it.id)+'" title="Delete this palette" aria-label="Delete '+esc(it.name)+'">✕</button></div>':'');});
  }else{
    const g=CAT[path[0]],it=g.items[path[1]];
    h+='<div class="crumb"><button class="back" data-up>‹ '+g.name+'</button></div><div class="title">'+esc(it.name)+'</div>'+(it.sub?'<div class="note" style="padding-top:0">'+it.sub+'</div>':'');
    it.lines.forEach(ln=>{h+='<button class="rowb'+(!loadMode&&ln.id==cur?' on':'')+'" data-l="'+ln.id+'"><div class="lbl">'+ln.label+(picks.includes(ln.id)?' <span class="tag">in the app</span>':'')+'</div>'+strip(ln.colors)+'</button>';});
  }
  return h;
}
function wireList(nav){
  nav.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{path=[+b.dataset.g];render();});
  nav.querySelectorAll('[data-delmine]').forEach(b=>b.onclick=()=>{const id=b.dataset.delmine,at=mine.findIndex(x=>x.id==id);if(at<0)return;
    goneMine={m:mine[at],at,picks:picks.slice(),cur};mine.splice(at,1);store.set('licorice-pal-mine',JSON.stringify(mine));
    if(draft&&draft.from==id){draft.from=null;saveDraft();}
    if(cur==id){cur='classic:markers';pick=0;pickSet=false;store.set('licorice-pal-line',cur);}
    rebuildCat();if(!mine.length)path=[];picks=picks.filter(x=>x!=id);savePicks();});
  nav.querySelectorAll('[data-undomine]').forEach(b=>b.onclick=()=>{const g=goneMine;goneMine=null;mine.splice(Math.min(g.at,mine.length),0,g.m);store.set('licorice-pal-mine',JSON.stringify(mine));
    const had=CAT[0].id=='mine';rebuildCat();if(!had)path=[];picks=g.picks.filter(id=>findLine(id)).slice(0,MAXPICK);
    if(g.cur==g.m.id&&cur=='classic:markers'){cur=g.m.id;store.set('licorice-pal-line',cur);}savePicks();});
  nav.querySelectorAll('[data-sort]').forEach(b=>b.onclick=()=>{sortMode=b.dataset.sort;sortMore=false;sortRef=cur;store.set('licorice-pal-sort',sortMode);render();});
  nav.querySelectorAll('[data-reref]').forEach(b=>b.onclick=()=>{sortRef=cur;render();});
  nav.querySelectorAll('[data-sortmore]').forEach(b=>b.onclick=()=>{sortMore=true;render();});
  const sc=nav.querySelector('#sortCol');if(sc)sc.oninput=()=>{sortCol=sc.value;store.set('licorice-pal-sort-col',sortCol);render();};
  nav.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{path=[path[0],+b.dataset.i];render();});
  nav.querySelectorAll('[data-up]').forEach(b=>b.onclick=()=>{path.pop();render();});
  nav.querySelectorAll('[data-cancel]').forEach(b=>b.onclick=()=>{loadMode=false;view='maker';render();});
  nav.querySelectorAll('[data-make]').forEach(b=>b.onclick=()=>{if(!draft)draft={name:'',recipe:{families:[{controls:[['','#1f4e8c'],['','#f2b134']],rounds:1,mode:'wheel'}]}};view='maker';render();});
  nav.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{const f=findLine(b.dataset.l);
    if(loadMode){openInMaker(f);return;}
    cur=b.dataset.l;pick=0;pickSet=false;store.set('licorice-pal-line',cur);render();renderCur();renderPicks();});
}
function openInMaker(f){const m=f.it.mine?mine.find(x=>x.id==f.ln.id):null;
  draft={name:m?m.name:f.it.name+(f.ln.label?' '+f.ln.label:'')+' (mine)',recipe:clone(f.ln.recipe),from:m?m.id:null};
  saveDraft();loadMode=false;view='maker';path=[];render();}

/* ---------- the maker: families of controls + rounds of bridges ---------- */
const total=()=>P.build(draft.recipe).length;
const famSize=f=>{let n=f.controls.length;for(let k=0;k<(f.rounds||0);k++)n=2*n-1;return n;};
function renderMaker(){
  const R=draft.recipe;let h='<div class="crumb"><button class="back" data-home>‹ Palettes</button></div>';
  h+='<div class="title">Make your own</div>';
  h+='<div class="mk-row"><input id="mkName" class="mk-name" placeholder="Name your palette" value="'+esc(draft.name||'')+'"></div>';
  h+='<div class="mk-row"><button class="b" data-load>Start from the list…</button>'+
     '<select id="mkMethod" class="b">'+P.METHODS.map((m,k)=>'<option value="'+k+'">'+m.name+'</option>').join('')+'</select><button class="b" data-roll>Roll</button></div>';
  R.families.forEach((f,fi)=>{

function fill(recipe){

  const sweep=(f,row,col)=>{const t=Math.min(1,Math.max(0,col/(CL-1)*.6+row/(RW-1)*.4+(rnd()-.5)*.12));return f.cols[Math.round(t*(f.cols.length-1))];};

  const anyOf=(f,row,col)=>{let c;for(let k=0;k<12;k++){c=f.cols[Math.floor(rnd()*f.cols.length)];if(!near(row,col).includes(c))break;}return c;};

  if(fillMode=='cluster')F.forEach((f,k)=>{if(k===fadeK)return;const m=Math.max(1,Math.round(W[k]*7*RW*CL/80));
    for(let i=0;i<m;i++)seeds.push({k,x:rnd()*CL,y:rnd()*(RW-1)*.87,r:fadeK<0?99:1.2+W[k]*3});});
  for(let row=0;row<RW;row++){grid[row]=[];for(let col=0;col<CL;col++){
    let k;

      seeds.forEach(s=>{const d=Math.hypot(s.x-x,s.y-y)+(rnd()-.5)*.6;if(d<bd&&d<s.r){bd=d;best=s;}});
      if(!best){k=fadeK<0?0:fadeK;}else{k=best.k;const f=F[k];

function paint(recipe){
  const svg=document.getElementById('sample'),[bg,ink]=PAPERS[dark?'dark':'light'];svg.style.background=bg;svg.parentNode.style.background=bg;let s='';
  const box=svg.getBoundingClientRect(),FW=Math.max(200,Math.round(box.width)),FH=Math.max(150,Math.round(box.height));
  const r=Math.max(TOUCH?30:22,Math.min(TOUCH?40:36,Math.min(FW,FH)/11)),w=r*Math.sqrt(3);
  CL=Math.ceil(FW/w)+1;RW=Math.ceil(FH/(1.5*r))+1;svg.setAttribute('viewBox','0 0 '+FW+' '+FH);
  fillNote='';tileMask=null;const grid=fill(recipe);document.getElementById('fillNote').textContent=fillNote+(tileMask?' One copy is outlined.':'');
  let edges='';
  for(let row=0;row<RW;row++)for(let col=0;col<CL;col++){
    const cx=col*w+(row%2?w/2:0),cy=row*r*1.5;
    const c=grid[row][col];
    const pts=[0,1,2,3,4,5].map(i=>{const a=Math.PI/3*i+Math.PI/6;return(cx+r*Math.cos(a)).toFixed(1)+','+(cy+r*Math.sin(a)).toFixed(1);}).join(' ');
